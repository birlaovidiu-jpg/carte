<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1018">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Carte">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="avvio/1206x2622.png?v=26">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="avvio/1284x2778.png?v=26">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="avvio/1290x2796.png?v=26">
<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="avvio/1320x2868.png?v=26">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="avvio/1125x2436.png?v=26">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="avvio/1242x2688.png?v=26">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="avvio/828x1792.png?v=26">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="avvio/1242x2208.png?v=26">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="avvio/750x1334.png?v=26">
<title>Carte</title>
<style>html,body{background:#0d1018;margin:0}.velo,.aperta-azioni,.foglio-velo,.avviso{opacity:0}.foglio{visibility:hidden}.camera,.agg-velo{position:fixed;inset:0}#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(120% 60% at 50% -10%,rgba(233,201,122,.13),transparent 60%),#0d1018;color:#f3f1ec;font:800 34px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;letter-spacing:-.025em}</style>
<link rel="stylesheet" href="stile.css?v=26" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="stile.css?v=26"></noscript>
</head>
<body>
<div id="splash">Carte</div>
<script>setTimeout(function(){var s=document.getElementById("splash");if(s)s.remove()},4000)</script>

<!-- Le carte -->
<main id="app">
  <header class="testa">
    <div>
      <h1>Carte</h1>
      <p class="conta" id="conta"></p>
    </div>
    <div class="testa-azioni">
      <button class="tondo" id="bMenu" aria-label="Menu">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <button class="tondo pieno" id="bAggiungi" aria-label="Aggiungi una carta">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <div class="striscia-elimina" id="strisciaElimina" hidden>
    <span>Tocca la carta da eliminare</span>
    <button class="btn piccolo" id="bFineElimina">Fine</button>
  </div>

  <section class="griglia" id="griglia"></section>

  <div class="vuoto" id="vuoto" hidden>
    <div class="vuoto-carte"><i></i><i></i><i></i></div>
    <h2>Nessuna carta</h2>
    <p>Premi <b>+</b> e inquadra il codice a barre della tua carta: si salva da sola.</p>
    <button class="btn primario" id="bAggiungiVuoto">Aggiungi una carta</button>
  </div>
</main>

<!-- Menu -->
<div class="menu" id="menu" hidden>
  <button id="mImpostazioni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Impostazioni</button>
  <button id="mRegistro"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Registro punti</button>
  <button id="mNome"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Il mio nome</button>
  <button id="mBackup"><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>Salva backup delle carte</button>
  <button id="mRipristina"><svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>Ripristina da backup</button>
  <button id="mElimina"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>Elimina una carta</button>
</div>

<!-- Carta aperta (girata, grande) -->
<div class="velo" id="velo"></div>
<div class="aperta-azioni" id="apertaAzioni">
  <button class="btn grande meno" id="bMeno"><span>−</span> Scarica punti</button>
  <button class="btn grande piu" id="bPiu"><span>+</span> Carica punti</button>
  <p class="suggerimento">Tocca la carta per chiuderla</p>
</div>

<!-- Foglio dal basso -->
<div class="foglio-velo" id="foglioVelo"></div>
<div class="foglio" id="foglio"><div class="maniglia"></div><div id="foglioDentro"></div></div>

<!-- Fotocamera -->
<section class="camera" id="camera" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="mirino" id="mirino"><i></i><i></i><i></i><i></i><div class="laser"></div><div class="fatto">✓</div></div>
  <div class="cam-testa">
    <button class="tondo scuro" id="bChiudiCamera" aria-label="Chiudi">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <p class="cam-testo" id="camTesto">Inquadra il codice a barre della carta</p>
</section>

<input type="file" id="fileBackup" accept=".json,application/json" hidden>
<!-- Finestrina «App aggiornata» -->
<div class="agg-velo" id="aggVelo" hidden>
  <div class="agg-box" role="dialog" aria-modal="true" aria-labelledby="aggTitolo">
    <div class="agg-testa">
      <img src="icona-192.png?v=26" alt="" class="agg-icona">
      <div>
        <h2 id="aggTitolo">App aggiornata</h2>
        <p class="agg-versione" id="aggVersione"></p>
      </div>
    </div>
    <div class="agg-novita" id="aggNovita" hidden>
      <p class="agg-sopra">Cosa è cambiato</p>
      <ul id="aggLista"></ul>
    </div>
    <div class="agg-azioni">
      <button class="btn primario" id="aggOk">OK</button>
      <button class="tondo agg-i" id="aggInfo" aria-label="Cosa è cambiato" aria-expanded="false">i</button>
    </div>
  </div>
</div>
<div class="avviso" id="avviso"></div>

<script type="module" src="app.js?v=26"></script>
</body>
</html>
